
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qamar Network</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00A2FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="icon" type="image/svg+xml" href="icon-192.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#FFFFFF;--soft:#F5F6F8;--ink:#000000;--mid:#333333;--acc:#00A2FF;--line:#E3E6EA;--onacc:#FFFFFF;--err:#D6423C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0C0E;--soft:#17191D;--ink:#FFFFFF;--mid:#C9CDD3;--line:#2A2D33}}
:root[data-theme="dark"]{--bg:#0B0C0E;--soft:#17191D;--ink:#FFFFFF;--mid:#C9CDD3;--line:#2A2D33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:20px 18px 96px;min-height:100vh}
h1{font-size:26px;line-height:1.2;margin:8px 0 6px;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;margin:22px 0 10px;font-weight:800}
p{color:var(--mid);margin:0 0 12px}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mid);margin-bottom:14px}
.err{background:#FDECEC;border:1px solid var(--err);color:var(--err);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.ok{background:#E9F8EE;border:1px solid #2FA84F;color:#1E7A3A;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:10px}
textarea{min-height:90px}
button,.card,.chip,.catbox,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{display:block;width:100%;text-align:center;background:var(--acc);color:var(--onacc);border:0;border-radius:10px;padding:14px;font-weight:800;text-decoration:none;margin:10px 0}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--err)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;margin:0 6px 6px 0;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.catbox{flex:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer}
.catbox input{width:auto;margin:0}
.checkline{display:flex;gap:8px;align-items:flex-start;color:var(--mid);font-size:14px;margin-bottom:14px}
.checkline input{width:auto;margin:3px 0 0}
.card{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--bg);width:100%;text-align:left;color:var(--ink)}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--acc);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:84px;height:84px;font-size:26px}
.card b{display:block}.card span{font-size:14px;color:var(--mid)}
.tag{display:inline-block;background:var(--soft);border-radius:8px;padding:4px 10px;font-size:13px;margin:0 6px 6px 0;color:var(--mid)}
.badge{display:inline-block;background:var(--acc);color:var(--onacc);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;margin-left:6px;vertical-align:middle}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;padding:8px 4px 10px;font-size:12px;color:var(--mid);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--acc);font-weight:800}
nav .tabicon{font-size:19px;line-height:1}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:14px}.stat b{font-size:24px;display:block}
.back{background:none;border:0;color:var(--acc);padding:0;font-weight:600;margin-bottom:8px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:26px 22px 22px;margin-bottom:18px;background:linear-gradient(160deg,#0B1F33 0%,#0F3A5F 60%,#00A2FF 140%);color:#fff}
.hero h1{color:#fff;margin:14px 0 6px}.hero p{color:#D6E9F7;margin:0}
.hero .stars{position:absolute;inset:0;pointer-events:none}
.tw{animation:tw 3.2s ease-in-out infinite}.tw2{animation-delay:1.1s}.tw3{animation-delay:2.1s}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tw{animation:none;opacity:.8}}
.brandbar{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;margin:2px 0 14px}
.legal{white-space:pre-wrap;font-size:14px;color:var(--mid)}
.qr{background:#fff;padding:14px;border-radius:12px;display:inline-block;margin:10px 0}
.qr img{display:block;width:180px;height:180px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--soft);border-radius:8px;padding:8px 10px;word-break:break-all;margin-bottom:10px}
</style>
</head>
<body>
<div id="app"><div class="banner">Lädt …</div></div>
<nav id="nav" hidden><div></div></nav>
<script>
// ---- Verbindung zu Supabase ----
const SUPABASE_URL = "https://imqlclsxqgyuhphjrefu.supabase.co";
const SUPABASE_KEY = "sb_publishable_DOUkpNolnd6B7XoLvBvVdA_3rozmeVJ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATS=["Bildung & Nachhilfe","Handwerk & Reparaturen","Gesundheit & Wohlbefinden","Recht & Finanzen","Kinderbetreuung & Familienhilfe","Ehrenamt & Gemeinschaftsdienst","Unternehmen & Handel","Kreatives & Organisation","Sonstige Unterstützung"];
const TWINT_LINK="https://go.twint.ch/1/e/tw?tw=acq.Z2nfDRAISKWBhPY9NHTimKOANnKUjeWpnpVrLWmvrk1PFKJaZ748ExZv4SgDDLuq";
const CONTACT_EMAIL="info@qamarnetwork.ch";
const S={session:null,view:"loading",tab:"net",msg:null,err:null,busy:false,
  results:[],cat:-1,loc:"",locations:[],q:"",sel:null,me:null,status:null,isAdmin:false,pending:[],members:[],stats:null,
  mfaFactors:[],mfaEnroll:null,mfaChallenge:null,loginHistory:null,magicSent:false,announcements:null};

// Einladungslink: ?code=XYZ in der URL füllt den Einladungscode automatisch vor.
(function(){
  const inviteCode=new URLSearchParams(location.search).get("code");
  if(inviteCode) S.reg={code:inviteCode};
})();

const app=document.getElementById("app"), navEl=document.getElementById("nav");

// ---- Logo: Netzwerk-Mond mit einem hervorgehobenen Knotenpunkt ----
function logo(size,color){
  const c=color||"currentColor";
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" aria-hidden="true" style="flex:none">
  <path d="M66 16 A44 44 0 1 0 66 104 A34 34 0 1 1 66 16 Z" fill="none" stroke="${c}" stroke-width="4"/>
  <line x1="66" y1="16" x2="96" y2="30" stroke="${c}" stroke-width="2" opacity="0.35"/>
  <line x1="96" y1="30" x2="104" y2="60" stroke="${c}" stroke-width="2" opacity="0.35"/>
  <line x1="104" y1="60" x2="96" y2="90" stroke="${c}" stroke-width="2" opacity="0.35"/>
  <line x1="96" y1="90" x2="66" y2="104" stroke="${c}" stroke-width="2" opacity="0.35"/>
  <circle cx="66" cy="16" r="4" fill="${c}"/>
  <circle cx="96" cy="30" r="4" fill="${c}"/>
  <circle cx="104" cy="60" r="10" fill="#00A2FF"/>
  <circle cx="96" cy="90" r="4" fill="${c}"/>
  <circle cx="66" cy="104" r="4" fill="${c}"/>
  </svg>`;
}
function brandBar(){return `<div class="brandbar">${logo(30)}<span>Qamar Network</span></div>`}
(function(){const svg=logo(64,"#0B1F33");
  const l=document.createElement("link");l.rel="icon";l.href="data:image/svg+xml,"+encodeURIComponent(svg);document.head.appendChild(l);})();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini=(a,b)=>((a||"?")[0]+(b||"")[0]).toUpperCase();
const avatar=(m,big)=>m.photo_path?`<div class="av${big?" big":""}"><img src="${esc(m.photo_path)}" alt=""></div>`:`<div class="av${big?" big":""}">${ini(m.first_name,m.last_name)}</div>`;
const isNew=d=>d && (Date.now()-new Date(d).getTime()) < 14*24*3600*1000;
const fmtDate=d=>{try{return new Date(d).toLocaleString("de-CH",{dateStyle:"medium",timeStyle:"short"})}catch(e){return d}};

function go(v,tab){S.view=v;if(tab)S.tab=tab;S.err=null;S.msg=null;render();window.scrollTo(0,0)}
function banner(){return S.err?`<div class="err">${esc(S.err)}</div>`:S.msg?`<div class="ok">${esc(S.msg)}</div>`:""}

// ---------- Bildschirme ----------
function screenLogin(){
  return `<div class="hero"><svg class="stars" width="100%" height="100%" aria-hidden="true">
      <circle class="tw" cx="12%" cy="18%" r="1.6" fill="#fff"/><circle class="tw tw2" cx="34%" cy="10%" r="1.2" fill="#fff"/>
      <circle class="tw tw3" cx="56%" cy="24%" r="1.4" fill="#fff"/><circle class="tw" cx="8%" cy="62%" r="1.2" fill="#fff"/>
      <circle class="tw tw2" cx="48%" cy="78%" r="1.6" fill="#fff"/><circle class="tw tw3" cx="24%" cy="86%" r="1.2" fill="#fff"/></svg>
    ${logo(72,"#ffffff")}<h1>Qamar Network</h1><p>Das geschlossene Netzwerk der Community: Jeder kann etwas Gutes beitragen. Zugang nur mit Einladung.</p><p style="font-weight:800;letter-spacing:.02em">Investiere in dein Netzwerk.</p></div>
  ${banner()}
  <div id="login-form">
    <input id="li-email" type="email" placeholder="E-Mail-Adresse" autocomplete="email" value="${esc(S.reg?.email)}">
    <input id="li-pass" type="password" placeholder="Passwort" autocomplete="current-password">
    <button class="btn" id="btn-login" ${S.busy?"disabled":""}>${S.busy?'<span class="spin"></span>':''}Anmelden</button>
    <button class="btn ghost" id="btn-magic" ${S.busy?"disabled":""}>Stattdessen Login-Link per E-Mail erhalten</button>
    <button class="btn ghost" data-go="register">Noch kein Konto? Registrieren</button>
    <button class="btn ghost" data-go="resetRequest">Passwort vergessen?</button>
  </div>
  <p style="font-size:12px;margin-top:18px">
    <a href="#" data-go="legalPrivacy" style="color:var(--mid)">Datenschutz</a> ·
    <a href="#" data-go="legalImprint" style="color:var(--mid)">Impressum</a> ·
    <a href="#" data-go="legalTerms" style="color:var(--mid)">Nutzungsbedingungen</a></p>`;
}
function screenResetRequest(){
  return `<button class="back" data-go="login">Zurück</button><h1>Passwort zurücksetzen</h1>
  <p>Gib deine E-Mail-Adresse ein. Wir schicken dir einen Link, mit dem du ein neues Passwort setzen kannst.</p>
  ${banner()}
  <input id="rr-email" type="email" placeholder="E-Mail-Adresse" autocomplete="email" value="${esc(S.reg?.email)}">
  <button class="btn" id="btn-reset-request" ${S.busy?"disabled":""}>${S.busy?'<span class="spin"></span>':''}Link anfordern</button>`;
}
function screenResetPassword(){
  return `<h1>Neues Passwort setzen</h1><p>Wähle ein neues Passwort für dein Konto.</p>
  ${banner()}
  <input id="rp-pass" type="password" placeholder="Neues Passwort (mind. 6 Zeichen)" autocomplete="new-password">
  <input id="rp-pass2" type="password" placeholder="Neues Passwort wiederholen" autocomplete="new-password">
  <button class="btn" id="btn-reset-confirm" ${S.busy?"disabled":""}>${S.busy?'<span class="spin"></span>':''}Passwort speichern</button>`;
}
function screenMfaVerify(){
  return `<h1>Sicherheitscode</h1><p>Gib den 6-stelligen Code aus deiner Authenticator-App ein.</p>
  ${banner()}
  <input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="6">
  <button class="btn" id="btn-mfa-verify" ${S.busy?"disabled":""}>${S.busy?'<span class="spin"></span>':''}Bestätigen</button>
  <button class="btn ghost" id="btn-mfa-cancel-login">Abbrechen</button>`;
}
function screenRegister(){
  return `<button class="back" data-go="login">Zurück</button><h1>Konto erstellen</h1>
  <p>Du benötigst einen gültigen Einladungscode.</p>
  ${banner()}
  <input id="re-first" placeholder="Vorname" autocomplete="given-name" value="${esc(S.reg?.first)}">
  <input id="re-last" placeholder="Nachname" autocomplete="family-name" value="${esc(S.reg?.last)}">
  <input id="re-code" placeholder="Einladungscode" value="${esc(S.reg?.code)}">
  <input id="re-email" type="email" placeholder="E-Mail-Adresse" autocomplete="email" value="${esc(S.reg?.email)}">
  <input id="re-pass" type="password" placeholder="Passwort (mind. 6 Zeichen)" autocomplete="new-password">
  <label class="checkline">
    <input id="re-consent" type="checkbox" ${S.reg?.consent?"checked":""}>
    Ich stimme zu, dass mein Profil nach der Freigabe für alle aktiven Mitglieder sichtbar ist. Mir ist bewusst, dass daraus Rückschlüsse auf meine Zugehörigkeit zur Community möglich sind. Ich kann mein Konto jederzeit löschen lassen.</label>
  <button class="btn" id="btn-register" ${S.busy?"disabled":""}>${S.busy?'<span class="spin"></span>':''}Registrieren</button>
  <p style="font-size:13px">Nach der Registrierung bestätigst du deine E-Mail-Adresse über den Link, den wir dir zuschicken.</p>`;
}
function screenCheckEmail(){
  return `<h1>Fast geschafft</h1><p>Wir haben dir eine Bestätigungs-E-Mail geschickt. Bitte klicke auf den Link darin und melde dich danach hier an.</p>
  <button class="btn" data-go="login">Zur Anmeldung</button>`;
}
function screenPending(){
  return `<h1>Antrag eingegangen</h1><p>Dein Konto wurde erstellt. Wir prüfen neue Mitglieder persönlich und schalten dich frei, sobald dein Profil bereit ist.</p>
  <p>Du kannst schon jetzt dein Profil ausfüllen — es wird erst nach der Freigabe für andere sichtbar.</p>
  <button class="btn" data-go="me">Profil ausfüllen</button>
  <button class="btn ghost" id="btn-logout">Abmelden</button>`;
}
function screenLockedNoPay(){
  const claimed=S.status?.payment_claimed_at;
  return `<h1>Zugriff freischalten</h1><p>Dein Profil ist freigegeben. Es fehlt noch der Jahresbeitrag von CHF 60.–, dann schalten wir dich frei.</p><p style="font-weight:800">Investiere in dein Netzwerk.</p>
  ${banner()}
  <a class="btn" href="${TWINT_LINK}" target="_blank" rel="noopener">Jetzt mit TWINT bezahlen</a>
  ${claimed?`<div class="ok">Zahlung gemeldet am ${esc(fmtDate(claimed))}. Wir prüfen und schalten dich in Kürze frei.</div>`
   :`<button class="btn ghost" id="btn-claim-payment" ${S.busy?"disabled":""}>${S.busy?'<span class="spin"></span>':''}Ich habe bezahlt</button>`}
  <p style="font-size:13px">Nach der Zahlung prüfen wir den Eingang und schalten dich anschliessend frei.</p>
  <p style="font-size:13px;margin-top:18px">Hast du einen Gutscheincode?</p>
  <input id="voucher-code" placeholder="Gutscheincode" style="text-transform:uppercase">
  <button class="btn ghost" id="btn-voucher" ${S.busy?"disabled":""}>${S.busy?'<span class="spin"></span>':''}Einlösen</button>
  <p style="font-size:12px;color:var(--mid)">Ein Gutschein befreit dich vom Jahresbeitrag. Dein Konto wird trotzdem noch von uns geprüft und danach freigeschaltet.</p>
  <button class="btn ghost" id="btn-logout">Abmelden</button>`;
}
function catTags(ids){return (ids||[]).map(i=>CATS[i-1]).filter(Boolean).map(c=>`<span class="tag">${esc(c)}</span>`).join("")}
function screenNet(){
  if(S.sel) return detail();
  const r=S.results;
  return `<h1>Willkommen in deinem Netzwerk</h1><p>Finde Menschen, die ihre Fähigkeiten für andere einsetzen, und du kannst deine eigenen anbieten.</p>
  ${banner()}
  <input id="q" type="search" placeholder="Name oder Angebot suchen" value="${esc(S.q)}">
  <select id="loc-filter"><option value="">Alle Standorte</option>${S.locations.map(l=>`<option value="${esc(l)}" ${S.loc===l?"selected":""}>${esc(l)}</option>`).join("")}</select>
  <div class="chips"><button class="chip ${S.cat<0?"on":""}" data-cat="-1">Alle</button>${CATS.map((c,i)=>`<button class="chip ${S.cat===i+1?"on":""}" data-cat="${i+1}">${c}</button>`).join("")}</div>
  <h2>${S.busy?"Suche läuft …":r.length+" "+(r.length===1?"Mitglied":"Mitglieder")}</h2>
  ${r.map(m=>`<button class="card" data-sel="${m.id}">${avatar(m)}<div><b>${esc(m.first_name)} ${esc(m.last_name)}${isNew(m.joined_at)?'<span class="badge">Neu</span>':''}</b><span>${esc(m.headline)}${m.company?", "+esc(m.company):""}<br>${esc(m.location)}</span></div></button>`).join("")||(S.busy?"":(S.q||S.cat>=0||S.loc?"<p>Keine Treffer. Ändere die Suche oder den Bereich.</p>":"<p>Noch keine anderen Mitglieder sichtbar. Sichtbar sind Mitglieder, die freigegeben sind und einen Namen im Profil haben. Dich selbst siehst du hier nicht.</p>"))}`;
}
function detail(){
  const m=S.sel;
  return `<button class="back" data-back>Zurück zur Liste</button>
  ${avatar(m,true)}<h1>${esc(m.first_name)} ${esc(m.last_name)}</h1><p>${esc(m.headline)}${m.company?", "+esc(m.company):""} ${m.location?"in "+esc(m.location):""}</p>
  ${catTags(m.profession_ids)}
  ${banner()}
  <button class="btn" id="btn-reveal">Per E-Mail kontaktieren</button>
  ${m.bio?`<h2>Über mich</h2><p>${esc(m.bio)}</p>`:""}
  ${m.services&&m.services.length?`<h2>Dienstleistungen</h2>${m.services.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}`:""}
  ${m.specialization?`<h2>Spezialisierung</h2><p>${esc(m.specialization)}</p>`:""}`;
}
function viewMe(p){
  return `<h1>Mein Profil</h1>${banner()}
  ${avatar(p,true)}
  <h1>${esc(p.first_name)} ${esc(p.last_name)}</h1>
  <p>${esc(p.headline)}${p.company?", "+esc(p.company):""}${p.location?" in "+esc(p.location):""}</p>
  ${catTags(p.profession_ids)}
  ${p.bio?`<h2>Über mich</h2><p>${esc(p.bio)}</p>`:""}
  ${p.services&&p.services.length?`<h2>Dienstleistungen</h2>${p.services.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}`:""}
  ${p.specialization?`<h2>Spezialisierung</h2><p>${esc(p.specialization)}</p>`:""}
  ${p.contact_email?`<h2>Kontakt</h2><p>${esc(p.contact_email)}</p>`:""}
  <p style="font-size:13px">So sehen dich andere aktive Mitglieder im Netzwerk. Dein Profil wurde ${p.views_count||0}× angesehen.</p>
  <button class="btn" id="btn-edit-profile">Profil bearbeiten</button>`;
}
function screenMe(){
  const p=S.me||{};
  if((p.first_name||p.last_name)&&!S.editing) return viewMe(p);
  const ids=p.profession_ids||(p.profession_id?[p.profession_id]:[]);
  return `<h1>Mein Profil</h1><p>Jeder kann etwas gut, ob aus dem Beruf, dem Hobby oder dem Alltag. Zeig, wie du der Community helfen kannst.</p>
  ${banner()}
  ${avatar(p,true)}
  <input id="pf-photo" type="file" accept="image/*" style="margin-top:10px">
  <input id="pf-first" placeholder="Vorname" value="${esc(p.first_name)}">
  <input id="pf-last" placeholder="Nachname" value="${esc(p.last_name)}">

async function loadAfterLogin(){
  S.session=(await sb.auth.getSession()).data.session;
  if(!S.session){go(S.reg?.code?"register":"login");return}
  const [{data:ms}, {data:pf}, {data:adm}] = await Promise.all([
    sb.from("member_status").select("*").eq("user_id",S.session.user.id).maybeSingle(),
    sb.from("profiles").select("*").eq("id",S.session.user.id).maybeSingle(),
    sb.rpc("am_i_admin")
  ]);
  S.status=ms; S.me=pf; S.isAdmin=!!adm;
  if(ms && ms.approval==='approved' && ms.membership_active){ go("net","net"); doSearch(); loadLocations(); }
  else if(ms && ms.approval==='pending'){ go("pending"); }
  else { go("lockedNoPay"); }
}
async function loadLocations(){
  const {data,error}=await sb.rpc("list_locations");
  if(!error) S.locations=(data||[]).map(r=>r.location);
}
async function loadNews(){
  S.announcements=null; render();
  const {data,error}=await sb.from("announcements").select("*").order("pinned",{ascending:false}).order("created_at",{ascending:false});
  S.announcements=error?[]:data;
  if(error) S.err="Konnte Mitteilungen nicht laden: "+error.message;
  render();
}
async function loadMfaFactors(){
  const {data,error}=await sb.auth.mfa.listFactors();
  if(!error) S.mfaFactors=data?.totp||[];
  render();
}
async function loadLoginHistory(){
  S.loginHistory=null; render();
  const {data,error}=await sb.from("login_history").select("*").eq("user_id",S.session.user.id).order("created_at",{ascending:false}).limit(15);
  S.loginHistory=error?[]:data;
  render();

async function doSearch(){
  S.busy=true; render();
  const {data,error}=await sb.rpc("search_members",{p_q:S.q,p_profession:S.cat<0?null:S.cat,p_location:S.loc});
  S.busy=false;
  if(error){S.err=error.message} else {S.results=data||[]}

}

async function afterPasswordSignIn(){
  const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal && aal.nextLevel==="aal2" && aal.nextLevel!==aal.currentLevel){
    const {data:factors}=await sb.auth.mfa.listFactors();
    const factor=(factors?.totp||[])[0];
    if(factor){
      const {data:ch,error:chErr}=await sb.auth.mfa.challenge({factorId:factor.id});
      if(chErr){S.err=chErr.message;render();return}
      S.mfaChallenge={factorId:factor.id,challengeId:ch.id};
      go("mfaVerify");
      return;
    }
  }
  await loadAfterLogin();
}

document.addEventListener("click", async e=>{
  // Klicks auf innere Elemente (Icon, Text, Foto) zählen als Klick auf den
  // umschliessenden Button/Link — sonst reagiert z. B. eine Mitglieder-Karte
  // nur, wenn man exakt den Rand trifft statt des Inhalts.
  const t=e.target.closest("button,a")||e.target;
  if(t.id==="btn-login"){
    const email=document.getElementById("li-email").value.trim();
    const pass=document.getElementById("li-pass").value;
    S.busy=true;S.err=null;render();
    const {error}=await sb.auth.signInWithPassword({email,password:pass});
    S.busy=false;
    if(error){S.err="Anmeldung fehlgeschlagen: "+error.message;render()} else {await afterPasswordSignIn()}
    return;
  }
  if(t.id==="btn-magic"){
    const email=document.getElementById("li-email").value.trim();
    if(!email){S.err="Bitte zuerst deine E-Mail-Adresse eingeben.";render();return}
    S.reg={...S.reg,email}; S.busy=true;S.err=null;render();
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin}});
    S.busy=false;
    if(error){S.err="Login-Link konnte nicht gesendet werden: "+error.message} else {S.msg="Login-Link gesendet. Bitte prüfe dein Postfach und klicke auf den Link."}
    render(); return;
  }
  if(t.id==="btn-mfa-verify"){
    const code=document.getElementById("mfa-code").value.trim();
    S.busy=true;S.err=null;render();
    const {error}=await sb.auth.mfa.verify({factorId:S.mfaChallenge.factorId,challengeId:S.mfaChallenge.challengeId,code});
    S.busy=false;
    if(error){S.err="Code ungültig: "+error.message;render();return}
    await loadAfterLogin(); return;
  }
  if(t.id==="btn-mfa-cancel-login"){ await sb.auth.signOut(); go("login"); return; }
  if(t.id==="btn-register"){
    const first=document.getElementById("re-first").value.trim();
    const last=document.getElementById("re-last").value.trim();
    const code=document.getElementById("re-code").value.trim();
    const email=document.getElementById("re-email").value.trim();
    const pass=document.getElementById("re-pass").value;
    const consent=document.getElementById("re-consent").checked;
    S.reg={first,last,code,email,consent};
    if(!first||!last||!code||!email||!pass){S.err="Bitte alle Felder ausfüllen, auch Vor- und Nachname.";render();return}
    if(!consent){S.err="Bitte stimme der Sichtbarkeit deines Profils zu, sonst können wir dich nicht aufnehmen.";render();return}
    S.busy=true;S.err=null;render();
    const {data:ok,error:codeErr}=await sb.rpc("use_invite_code",{p_code:code});
    if(codeErr||!ok){S.busy=false;S.err="Ungültiger oder abgelaufener Einladungscode.";render();return}
    const {error}=await sb.auth.signUp({email,password:pass,options:{data:{first_name:first,last_name:last,consent_visibility:"true",consent_version:"1"}}});
    S.busy=false;
    if(error){S.err="Registrierung fehlgeschlagen: "+error.message;render()} else {go("checkemail")}
    return;
  }
  if(t.id==="btn-edit-profile"){S.editing=true;render();return;}
  if(t.id==="btn-logout"){ await sb.auth.signOut(); S.status=null;S.me=null;S.isAdmin=false; go("login"); return; }
  if(t.dataset.go){
    if(t.dataset.go==="me") S.editing=false;
    if(t.dataset.go==="set"){ S.confirmDelete=false; S.mfaEnroll=null; loadMfaFactors(); }
    if(t.dataset.go==="loginHistory") loadLoginHistory();
    go(t.dataset.go, ["net","news","me","mem","set"].includes(t.dataset.go)?t.dataset.go:undefined);
    if(t.dataset.go==="net"){ S.sel=null; doSearch(); loadLocations(); }
    if(t.dataset.go==="news"){ loadNews(); }
    if(t.dataset.go==="admin"){ loadAdmin(); }
    return; }
  if(t.dataset.cat!==undefined){ S.cat=+t.dataset.cat; doSearch(); return; }
  if(t.dataset.sel){ const m=S.results.find(x=>x.id===t.dataset.sel);
    S.busy=true;render();
    const {data,error}=await sb.rpc("get_member",{p_id:t.dataset.sel});
    S.busy=false;
    if(error||!data||!data.length){S.err="Profil nicht verfügbar. Die Liste wurde aktualisiert.";render();doSearch();return}
    S.sel=data[0]; render(); return; }
  if(t.dataset.back!==undefined){ S.sel=null; render(); return; }
  if(t.id==="btn-reveal"){
    S.busy=true;render();
    const {data,error}=await sb.rpc("get_member_email",{p_id:S.sel.id});
    S.busy=false;
    if(error||!data){S.err="E-Mail-Adresse nicht verfügbar.";render();return}
    location.href="mailto:"+data+"?subject="+encodeURIComponent("Kontaktanfrage über Qamar Network");
    return; }
  if(t.id==="btn-save-profile"){
    const val=id=>document.getElementById(id).value.trim();
    const catIds=[...document.querySelectorAll("[data-pf-cat]:checked")].map(x=>+x.value);
    const photoFile=document.getElementById("pf-photo").files[0];
    const payload={first_name:val("pf-first"),last_name:val("pf-last"),headline:val("pf-headline"),
      profession_id:catIds[0]||null, profession_ids:catIds,
      company:val("pf-company"), show_company:document.getElementById("pf-show-company").checked,
      location:val("pf-location"),specialization:val("pf-spec"),
      bio:val("pf-bio"),services:val("pf-services").split(",").map(s=>s.trim()).filter(Boolean),
      contact_email:val("pf-email"),published:true};
    S.busy=true;S.err=null;render();
    if(photoFile){
      const ext=(photoFile.name.split(".").pop()||"jpg").toLowerCase();
      const path=S.session.user.id+"/photo."+ext;
      const {error:upErr2}=await sb.storage.from("avatars").upload(path,photoFile,{upsert:true});
      if(upErr2){S.busy=false;S.err="Foto konnte nicht hochgeladen werden: "+upErr2.message;render();return}
      const {data:pub}=sb.storage.from("avatars").getPublicUrl(path);
      payload.photo_path=pub.publicUrl+"?t="+Date.now();
    }
    const {data:upd,error:upErr}=await sb.from("profiles").update(payload).eq("id",S.session.user.id).select();
    const error=upErr||((!upd||!upd.length)?{message:"Es wurde kein Profil aktualisiert. Bitte melde dich neu an."}:null);
    S.busy=false;
    if(error){S.err="Konnte nicht speichern: "+error.message} else {S.msg="Profil gespeichert."; S.editing=false; S.me={...S.me,...payload}}
    render(); return; }
  if(t.id==="btn-export-data"){
    const payload={profil:S.me,mitgliedschaft:S.status,konto:{email:S.session.user.email,erstellt:S.session.user.created_at}};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="qamar-network-meine-daten.json"; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    return; }
  if(t.id==="btn-mfa-enable"){
    S.busy=true;S.err=null;render();
    const {data,error}=await sb.auth.mfa.enroll({factorType:"totp"});
    S.busy=false;
    if(error){S.err="Konnte nicht aktiviert werden: "+error.message;render();return}
    S.mfaEnroll={id:data.id,qr:data.totp.qr_code,secret:data.totp.secret};
    render(); return; }
  if(t.id==="btn-mfa-cancel"){
    if(S.mfaEnroll) await sb.auth.mfa.unenroll({factorId:S.mfaEnroll.id});
    S.mfaEnroll=null; render(); return; }
  if(t.id==="btn-mfa-confirm"){
    const code=document.getElementById("mfa-enroll-code").value.trim();
    S.busy=true;S.err=null;render();
    const {data:ch,error:chErr}=await sb.auth.mfa.challenge({factorId:S.mfaEnroll.id});
    if(chErr){S.busy=false;S.err=chErr.message;render();return}
    const {error:vErr}=await sb.auth.mfa.verify({factorId:S.mfaEnroll.id,challengeId:ch.id,code});
    S.busy=false;
    if(vErr){S.err="Code ungültig: "+vErr.message;render();return}
    S.mfaEnroll=null; S.msg="Zwei-Faktor-Anmeldung aktiviert."; loadMfaFactors(); return; }
  if(t.dataset.mfaUnenroll){
    S.busy=true;render();
    const {error}=await sb.auth.mfa.unenroll({factorId:t.dataset.mfaUnenroll});
    S.busy=false;
    if(error){S.err=error.message;render();return}
    S.msg="Zwei-Faktor-Anmeldung deaktiviert."; loadMfaFactors(); return; }
  if(t.id==="btn-delete-account"){ S.confirmDelete=true; render(); return; }
  if(t.id==="btn-delete-cancel"){ S.confirmDelete=false; render(); return; }
  if(t.id==="btn-delete-confirm"){
    S.busy=true;render();
    const {error}=await sb.rpc("request_account_deletion");
    S.busy=false;
    if(error){S.err="Konto konnte nicht gelöscht werden: "+error.message;render();return}
    await sb.auth.signOut();
    S.status=null;S.me=null;S.isAdmin=false;S.confirmDelete=false;
    go("login"); S.msg="Dein Konto wurde gelöscht.";render();
    return; }
  if(t.id==="btn-post-news"){
    const title=document.getElementById("an-title").value.trim();
    const body=document.getElementById("an-body").value.trim();
    const eventVal=document.getElementById("an-event").value;
    const pinned=document.getElementById("an-pin").checked;
    if(!title){S.err="Bitte einen Titel eingeben.";render();return}
    S.busy=true;S.err=null;render();
    const {error}=await sb.from("announcements").insert({title,body,pinned,
      event_at:eventVal?new Date(eventVal).toISOString():null, created_by:S.session.user.id});
    S.busy=false;
    if(error){S.err="Konnte nicht veröffentlicht werden: "+error.message;render();return}
    S.msg="Mitteilung veröffentlicht."; loadNews(); return; }
  if(t.dataset.delNews){
    await sb.from("announcements").delete().eq("id",t.dataset.delNews); loadNews(); return; }
  if(t.id==="btn-claim-payment"){
    S.busy=true;S.err=null;render();
    const {error}=await sb.rpc("claim_payment");
    S.busy=false;
    if(error){S.err="Konnte nicht gemeldet werden: "+error.message;render();return}
    S.status={...S.status,payment_claimed_at:new Date().toISOString()};
    S.msg="Danke! Zahlung gemeldet — wir prüfen und schalten dich in Kürze frei.";
    render(); return; }
  if(t.id==="btn-voucher"){
    const code=document.getElementById("voucher-code").value.trim().toUpperCase();
    if(!code){S.err="Bitte einen Gutscheincode eingeben.";render();return}
    S.busy=true;S.err=null;render();
    const {data:ok,error}=await sb.rpc("redeem_discount_code",{p_code:code});
    S.busy=false;
    if(error||!ok){S.err="Ungültiger oder abgelaufener Gutscheincode.";render();return}
    await loadAfterLogin();
    S.msg="Gutschein eingelöst. Dein Beitrag entfällt – dein Konto wird trotzdem noch von uns geprüft, bevor es freigeschaltet wird.";
    render();
    return; }
  if(t.dataset.approve){ await sb.from("member_status").update({approval:"approved",membership_active:true}).eq("user_id",t.dataset.approve); loadAdmin(); return; }
  if(t.dataset.dismissClaim){ await sb.rpc("dismiss_payment_claim",{p_user_id:t.dataset.dismissClaim}); loadAdmin(); return; }
  if(t.id==="btn-reset-request"){
    const email=document.getElementById("rr-email").value.trim();
    if(!email){S.err="Bitte deine E-Mail-Adresse eingeben.";render();return}
    S.reg={...S.reg,email}; S.busy=true;S.err=null;render();
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
    S.busy=false;
    if(error){S.err="Konnte nicht gesendet werden: "+error.message} else {S.msg="Falls diese E-Mail-Adresse registriert ist, wurde ein Link zum Zurücksetzen gesendet. Bitte Postfach (auch Spam) prüfen."}
    render(); return; }
  if(t.id==="btn-reset-confirm"){
    const pass=document.getElementById("rp-pass").value;
    const pass2=document.getElementById("rp-pass2").value;
    if(!pass||pass.length<6){S.err="Das Passwort muss mindestens 6 Zeichen haben.";render();return}
    if(pass!==pass2){S.err="Die Passwörter stimmen nicht überein.";render();return}
    S.busy=true;S.err=null;render();
    const {error}=await sb.auth.updateUser({password:pass});
    S.busy=false;
    if(error){S.err="Konnte nicht gespeichert werden: "+error.message;render();return}
    S.msg="Passwort gespeichert. Du bist jetzt angemeldet.";
    await loadAfterLogin(); return; }
  if(t.dataset.block){ await sb.from("member_status").update({approval:"blocked"}).eq("user_id",t.dataset.block); loadAdmin(); return; }
  if(t.dataset.reject){ await sb.from("member_status").update({approval:"rejected"}).eq("user_id",t.dataset.reject); loadAdmin(); return; }
});
app.addEventListener("input", e=>{
  if(e.target.id==="q"){ S.q=e.target.value; scheduleSearch(); }
});
app.addEventListener("change", e=>{
  if(e.target.id==="loc-filter"){ S.loc=e.target.value; doSearch(); }
});

async function loadAdmin(){
  const [pend,st,all]=await Promise.all([sb.rpc("list_pending_members"), sb.rpc("admin_stats"), sb.rpc("list_all_members")]);
  const firstErr=pend.error||st.error||all.error;
  if(firstErr){ S.err="Admin-Daten konnten nicht geladen werden: "+firstErr.message; }
  S.pending=pend.data||[]; S.members=all.data||[]; S.stats=(st.data&&st.data[0])||{}; render();
}

sb.auth.onAuthStateChange((event,session)=>{
  S.session=session;
  if(event==="PASSWORD_RECOVERY"){ go("resetPassword"); return; }
  if(event==="SIGNED_IN" && session){
    sb.from("login_history").insert({user_id:session.user.id,user_agent:navigator.userAgent}).then(()=>{});
  }
});
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
loadAfterLogin();
</script>
</body>
</html>
