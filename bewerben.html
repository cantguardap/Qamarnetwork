<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qamar Network — Bewerbung</title>
<meta name="description" content="Qamar Network: Das geschlossene Netzwerk der Community in der Schweiz. Bewirb dich für einen Zugang.">
<link rel="icon" type="image/svg+xml" href="icon-192.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#FFFFFF;--soft:#F5F6F8;--ink:#000000;--mid:#333333;--acc:#00A2FF;--line:#E3E6EA;--onacc:#FFFFFF;--err:#D6423C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0C0E;--soft:#17191D;--ink:#FFFFFF;--mid:#C9CDD3;--line:#2A2D33}}
:root[data-theme="dark"]{--bg:#0B0C0E;--soft:#17191D;--ink:#FFFFFF;--mid:#C9CDD3;--line:#2A2D33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 60px;min-height:100vh}
h1{font-size:28px;line-height:1.2;margin:10px 0 8px;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;margin:26px 0 10px;font-weight:800}
p{color:var(--mid);margin:0 0 12px}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mid);margin-bottom:14px}
.err{background:#FDECEC;border:1px solid var(--err);color:var(--err);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.ok{background:#E9F8EE;border:1px solid #2FA84F;color:#1E7A3A;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
input,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:10px}
textarea{resize:vertical;min-height:90px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;border:0;background:var(--acc);color:var(--onacc);font:inherit;font-weight:800;font-size:15px;margin-bottom:10px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn[disabled]{opacity:.6}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:10px 14px;font-size:14px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:30px 22px 26px;margin-bottom:22px;background:linear-gradient(160deg,#0B1F33 0%,#0F3A5F 60%,#00A2FF 140%);color:#fff}
.hero .stars{position:absolute;inset:0;pointer-events:none}
.tw{animation:tw 3.2s ease-in-out infinite}.tw2{animation-delay:1.1s}.tw3{animation-delay:2.1s}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tw{animation:none;opacity:.8}}
.hero h1{margin:14px 0 8px}
.hero p{color:rgba(255,255,255,.85);margin:0 0 6px}
.pillars{display:grid;gap:10px;margin:18px 0}
.pillar{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pillar b{display:block;margin-bottom:2px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
footer{margin-top:28px;font-size:12px;color:var(--mid)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function logo(size,color){
  const c=color||"currentColor";
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" aria-hidden="true" style="flex:none">
  <path d="M66 16 A44 44 0 1 0 66 104 A34 34 0 1 1 66 16 Z" fill="none" stroke="${c}" stroke-width="4"/>
  <line x1="66" y1="16" x2="96" y2="30" stroke="${c}" stroke-width="2" opacity="0.35"/>
  <line x1="96" y1="30" x2="104" y2="60" stroke="${c}" stroke-width="2" opacity="0.35"/>
  <line x1="104" y1="60" x2="96" y2="90" stroke="${c}" stroke-width="2" opacity="0.35"/>
  <line x1="96" y1="90" x2="66" y2="104" stroke="${c}" stroke-width="2" opacity="0.35"/>
  <circle cx="66" cy="16" r="4" fill="${c}"/>
  <circle cx="96" cy="30" r="4" fill="${c}"/>
  <circle cx="104" cy="60" r="10" fill="#00A2FF"/>
  <circle cx="96" cy="90" r="4" fill="${c}"/>
  <circle cx="66" cy="104" r="4" fill="${c}"/>
  </svg>`;
}
(function(){const svg=logo(64,"#0B1F33");
  const l=document.createElement("link");l.rel="icon";l.href="data:image/svg+xml,"+encodeURIComponent(svg);document.head.appendChild(l);})();

const SUPABASE_URL = "https://imqlclsxqgyuhphjrefu.supabase.co";
const SUPABASE_KEY = "sb_publishable_DOUkpNolnd6B7XoLvBvVdA_3rozmeVJ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S={gender:"",busy:false,err:null,done:false,f:{}};

function render(){
  if(S.done){
    app.innerHTML=`<div class="hero">${logo(56,"#ffffff")}<h1>Bewerbung erhalten</h1>
      <p>Danke für dein Interesse an Qamar Network. Wir prüfen deine Angaben persönlich und melden uns bei dir per E-Mail, sobald wir entschieden haben.</p></div>
      <p>Falls du Fragen hast, kannst du uns jederzeit kontaktieren.</p>`;
    return;
  }
  app.innerHTML=`
  <div class="hero"><svg class="stars" width="100%" height="100%" aria-hidden="true">
      <circle class="tw" cx="12%" cy="18%" r="1.6" fill="#fff"/><circle class="tw tw2" cx="34%" cy="10%" r="1.2" fill="#fff"/>
      <circle class="tw tw3" cx="56%" cy="24%" r="1.4" fill="#fff"/><circle class="tw" cx="8%" cy="62%" r="1.2" fill="#fff"/>
      <circle class="tw tw2" cx="48%" cy="78%" r="1.6" fill="#fff"/><circle class="tw tw3" cx="24%" cy="86%" r="1.2" fill="#fff"/></svg>
    ${logo(56,"#ffffff")}<h1>Qamar Network</h1>
    <p>Das geschlossene Netzwerk der Community in der Schweiz — unter strengsten islamischen Bedingungen. Zugang nur nach persönlicher Prüfung, nicht per Selbstregistrierung.</p>
    <p style="font-weight:800;letter-spacing:.02em;color:#fff">Investiere in dein Netzwerk.</p></div>

  <div class="pillars">
    <div class="pillar"><b>Geschlossen &amp; geschützt</b>Jedes Profil wird persönlich geprüft, bevor es freigeschaltet wird.</div>
    <div class="pillar"><b>Getrennt nach Geschlecht</b>Männer und Frauen sehen sich innerhalb des Netzwerks nicht gegenseitig.</div>
    <div class="pillar"><b>Kein offener Zugang</b>Eine Registrierung ist nur mit persönlicher Freigabe und Einladungscode möglich.</div>
  </div>

  <h2>Bewerbung</h2>
  ${S.err?`<div class="err">${esc(S.err)}</div>`:""}
  <input id="ap-first" placeholder="Vorname" autocomplete="given-name" value="${esc(S.f.first)}">
  <input id="ap-last" placeholder="Nachname" autocomplete="family-name" value="${esc(S.f.last)}">
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <button type="button" class="chip${S.gender==="m"?" on":""}" data-gender="m" style="flex:1">Mann</button>
    <button type="button" class="chip${S.gender==="f"?" on":""}" data-gender="f" style="flex:1">Frau</button>
  </div>
  <input id="ap-email" type="email" placeholder="E-Mail-Adresse" autocomplete="email" value="${esc(S.f.email)}">
  <textarea id="ap-msg" placeholder="Ein paar Worte zu dir (optional): Beruf, Wohnort, wie du von uns gehört hast …">${esc(S.f.msg)}</textarea>
  <button class="btn" id="btn-submit" ${S.busy?"disabled":""}>${S.busy?'<span class="spin"></span>':''}Bewerbung senden</button>
  <p style="font-size:12px">Mit dem Absenden erklärst du dich einverstanden, dass wir deine Angaben zur Prüfung deiner Bewerbung speichern.</p>
  <footer>© Qamar Network</footer>`;
}
render();

app.addEventListener("click", async e=>{
  const t=e.target.closest("button")||e.target;
  if(t.dataset.gender){ S.gender=t.dataset.gender; render(); return; }
  if(t.id==="btn-submit"){
    const first=document.getElementById("ap-first").value.trim();
    const last=document.getElementById("ap-last").value.trim();
    const email=document.getElementById("ap-email").value.trim();
    const msg=document.getElementById("ap-msg").value.trim();
    S.f={first,last,email,msg};
    if(!first||!last||!email){ S.err="Bitte Vorname, Nachname und E-Mail-Adresse angeben."; render(); return; }
    if(!S.gender){ S.err="Bitte wähle, ob du ein Mann oder eine Frau bist."; render(); return; }
    S.busy=true; S.err=null; render();
    const {error}=await sb.rpc("submit_application",{p_first:first,p_last:last,p_email:email,p_gender:S.gender,p_message:msg});
    S.busy=false;
    if(error){ S.err=error.message||"Bewerbung konnte nicht gesendet werden. Bitte später erneut versuchen."; render(); return; }
    S.done=true; render();
  }
});
</script>
</body>
</html>
